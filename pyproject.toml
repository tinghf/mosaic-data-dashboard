[project]
name = "mosaic-dashboard"
version = "0.1.0"
description = "Local Streamlit dashboard for the MOSAIC processed-data inspector"
readme = "README.md"
authors = [
    { name = "Tony Ting", email = "tony.ting@gatesfoundation.org" }
]
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.57,<2.0",
    "pandas>=3.0,<4.0",
    "geopandas>=1.1,<2.0",
    "folium>=0.20,<1.0",
    "streamlit-folium>=0.27,<1.0",
]

[project.scripts]
mosaic-dashboard = "mosaic_dashboard:main"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"
